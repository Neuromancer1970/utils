<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7">
<title>Text Cleaner</title>
<style>
  :root { color-scheme: light; --ink:#171717; --muted:#6b7280; --line:#d7d9df; --panel:#fff; --bg:#f5f5f7; --accent:#171717; }
  * { box-sizing:border-box; }
  body { margin:0; padding: max(18px, env(safe-area-inset-top)) 16px max(18px, env(safe-area-inset-bottom)); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width:760px; margin:0 auto; }
  h1 { font-size:27px; letter-spacing:-.6px; margin:8px 0 5px; }
  p { color:var(--muted); font-size:14px; margin:0 0 18px; }
  textarea { display:block; width:100%; min-height:54vh; resize:vertical; padding:15px; border:1px solid var(--line); border-radius:15px; background:var(--panel); color:var(--ink); font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; outline:none; box-shadow:0 1px 3px #00000008; }
  textarea:focus { border-color:#888; }
  .buttons { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; margin-top:12px; }
  button { min-height:49px; border:1px solid var(--line); border-radius:12px; background:#fff; color:var(--ink); font-size:16px; font-weight:600; padding:10px 12px; touch-action:manipulation; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button:active { transform:scale(.985); }
  #status { min-height:22px; margin-top:12px; font-size:13px; color:var(--muted); }
  @media (min-width:560px) { .buttons { grid-template-columns:repeat(4,minmax(0,1fr)); } textarea { min-height:60vh; } }
</style>
</head>
<body>
<main>
  <h1>Text Cleaner</h1>
  <p>Collez votre texte, puis appuyez sur Clean.</p>
  <textarea id="text" placeholder="Collez ou écrivez votre texte ici…" autocapitalize="sentences" spellcheck="false"></textarea>
  <div class="buttons">
    <button class="primary" id="clean">Clean</button>
    <button id="clear">Clear</button>
    <button id="select">Select all</button>
    <button id="copy">Copier</button>
  </div>
  <div id="status" role="status" aria-live="polite"></div>
</main>
<script>
const area = document.getElementById('text');
const status = document.getElementById('status');
function say(message) { status.textContent = message; }
document.getElementById('clean').addEventListener('click', () => {
  let s = area.value;
  s = s.replace(/\r\n?/g, '\n');             // uniformise les retours à la ligne
  s = s.replace(/[\u00A0\u202F\u2007]/g, ' '); // espaces insécables
  s = s.split('\n').map(line => line.replace(/[\t ]+/g, ' ').trim()).join('\n');
  s = s.replace(/\n{3,}/g, '\n\n').trim();    // au plus une ligne vide entre les paragraphes
  s = s.replace(/[ \t]+([,.;:!?])/g, '$1');   // espace avant la ponctuation supprimé
  area.value = s;
  say('Texte nettoyé.');
});
document.getElementById('clear').addEventListener('click', () => { area.value = ''; say('Texte effacé.'); area.focus(); });
document.getElementById('select').addEventListener('click', () => { area.focus(); area.select(); say('Tout le texte est sélectionné.'); });
document.getElementById('copy').addEventListener('click', async () => {
  area.focus();
  try {
    if (navigator.clipboard && window.isSecureContext) await navigator.clipboard.writeText(area.value);
    else { area.select(); const ok = document.execCommand('copy'); if (!ok) throw new Error('copy failed'); }
    say('Texte copié.');
  } catch (e) {
    area.select(); say('Sélectionnez le texte, puis choisissez Copier dans le menu iPhone.');
  }
});
</script>
</body>
</html>
